[project]
name = "build-pmtiles"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "gpxpy>=1.6",
    "geopandas>=1.0",
    "doit>=0.36",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
relative_files = true
